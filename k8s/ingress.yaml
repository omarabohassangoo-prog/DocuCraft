apiVersion: v1
kind: Service
metadata:
  name: ufuq-commerce-web-svc
  labels:
    app: ufuq-commerce
spec:
  type: ClusterIP
  selector:
    app: ufuq-commerce
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ufuq-commerce-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - commerce.example.com
      secretName: ufuq-commerce-tls
  rules:
    - host: commerce.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ufuq-commerce-web-svc
                port:
                  number: 80
