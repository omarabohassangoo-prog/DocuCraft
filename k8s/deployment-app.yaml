apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufuq-commerce-web
  labels:
    app: ufuq-commerce
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ufuq-commerce
  template:
    metadata:
      labels:
        app: ufuq-commerce
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ufuq-commerce:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ufuq-commerce-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ufuq-commerce-web
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
